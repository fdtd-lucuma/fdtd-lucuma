[domain]
Lx = 7620e-9   # [m]
Ly = 7620e-9   # [m]
Lz = 990e-9    # [m]
dx = 30e-9     # spatial step x: [m]
dy = 30e-9     # spatial step y: [m]
dz = 30e-9     # spatial step z: [m]

[pml]
xy       = 600e-9   # PML thickness in x and y: [m]
z        = 210e-9   # PML thickness in z: [m]
m        = 4        # polynomial grading order
R        = 1e-16    # target reflection coefficient

[material]
eps0     = 8.854187817e-12   # vacuum permittivity: [F/m]
eps_fg   = 4.2               # foreground relative permittivity: Si3N4
eps_bg   = 2.13              # background relative permittivity: SiO2
mu0      = 1.2566370614e-6   # vacuum permeability: [H/m]
sigma_m  = 0.0               # magnetic conductivity: [Ohm/m]
sigma_fg = 0.0               # foreground electric conductivity Si3N4: [S/m]
sigma_bg = 0.0               # background electric conductivity SiO2: [S/m]

[filters]
radius=90e-9   # density filter radius (Manhattan distance): [m]
neighbours=[0,0,0]    # filter radius in grid cells [x, y, z]; recomputed from radius/dx,dy,dz during "cont" stage, used as-is otherwise
eta={nom=0.5, ero=0.55, dil=0.45}   # tanh projection thresholds: nominal, eroded, dilated


[optimizer]
algorithm = "lbfgs"

[simulation]
t     = 3000            # number of time steps
freqs = [561e12, 532e12]   # optimization frequencies: [Hz]
stage      = "cont"                                      # stage: "cont", "disc", or "fab"
beta = 0                 # current projection sharpness, advances through beta_range within the active stage
it = 1                    # current optimization iteration number
step = 20                 # save results every this many iterations
cont       = 2000                                    # number of iterations in the continuous stage
disc       = 800                                        # number of iterations in the discrete stage
fab        = 400                                       # number of iterations in the fabrication stage
beta_range = {cont = [0,0], disc = [1,3], fab = [4,6]}   # projection sharpness (beta) range per stage
bin_threshold = 0.5                                      # final threshold applied to binarize the result
